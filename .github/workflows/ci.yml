# Pull requests: schema-check the catalog, and run this repository's MediaClaw
# format check on changed plugin directories, example/hello-note, and the
# reference copies listed in example/UPSTREAM.json. Their tests are not
# in the tree — they do not run standalone — so the unittest step below
# sees no tests/ directory and skips them. A README-only change skips the
# MediaClaw install.
#
# Plugins with a [dependencies] lock file also go through MediaClaw's lock
# checker (pinned, exact versions, hashes, wheels only, no clash with the
# packages the server ships) and a real hash-checked pip install inside the
# server image's base (python:3.12-slim-bookworm) on linux/amd64 and
# linux/arm64, so both architectures are known to have wheels. Those plugins
# get the full check_plugin.py run in the lock-check job instead of the
# validate job, because their tests need the locked packages installed.

name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  catalog:
    name: catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # every tag: each version in the index is read back from its own tag
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint plugins, check index.json, run script tests
        run: |
          set -euo pipefail
          python3 -m pip install jsonschema pyyaml
          python3 scripts/generate_index.py --lint
          if [ -d scripts/tests ]; then
            python3 -m unittest discover -s scripts/tests -t scripts -v
          else
            echo "scripts/tests 不存在，跳过仓库脚本测试"
          fi
          python3 scripts/generate_index.py --check index.json

  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.pick.outputs.run }}
      dirs: ${{ steps.pick.outputs.dirs }}
      locks: ${{ steps.pick.outputs.locks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select plugin directories
        id: pick
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci_dirs.py

  validate:
    name: validate
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # 插件测试要导入宿主 SDK、宿主已安装依赖和媒体处理模块。直接使用公开的
    # MediaClaw 运行镜像，避免公共插件仓库的 CI 依赖私有主仓库源码或令牌。
    container:
      image: leaf1022/mediaclaw:v0.51.0
      options: --user root
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: MediaClaw format check and plugin tests
        env:
          DIRS: ${{ needs.changes.outputs.dirs }}
          LOCKS: ${{ needs.changes.outputs.locks }}
        run: |
          set -euo pipefail
          if [ -z "$DIRS" ]; then
            echo "没有要校验的插件目录" >&2
            exit 1
          fi
          read -r -a dirs <<< "$DIRS"
          checker="scripts/check_plugin.py"
          for dir in "${dirs[@]}"; do
            if [[ " $LOCKS " == *" ${dir}/"* ]]; then
              echo "${dir} 声明了 [dependencies]，由 dependencies (lock check) 用新版检查器校验"
              continue
            fi
            echo "::group::${dir}"
            python3 "$checker" "$dir"
            # Reference copies under example/<id>/ (UPSTREAM.json) have no
            # tests/ on purpose. Do not point this at MediaClaw's own tests/.
            if [ -f "${dir}/pytest.ini" ]; then
              python3 -m pip install 'pytest>=8.4,<9' 'pytest-asyncio>=1.1,<2'
              python3 -m pytest -c "${dir}/pytest.ini" "${dir}/tests" -v
            elif [ -d "${dir}/tests" ]; then
              python3 -m unittest discover -s "${dir}/tests" -t "$dir" -v
            fi
            echo "::endgroup::"
          done

  dependencies:
    name: dependencies (lock check)
    needs: changes
    if: needs.changes.outputs.locks != ''
    runs-on: ubuntu-latest
    container:
      image: leaf1022/mediaclaw:v0.51.0
      options: --user root
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Lock files, MediaClaw format check, and plugin tests
        env:
          LOCKS: ${{ needs.changes.outputs.locks }}
        run: |
          set -euo pipefail
          read -r -a locks <<< "$LOCKS"
          checker="scripts/check_plugin.py"
          for lock in "${locks[@]}"; do
            dir="$(dirname "$lock")"
            echo "::group::${dir}"
            python3 "$checker" "$dir"
            if [ -d "${dir}/tests" ]; then
              # The plugin's locked packages, for its own tests only. Keep them
              # off the checker's path: it would count them as host packages.
              deps_dir="$(mktemp -d)"
              python3 -m pip install --disable-pip-version-check --quiet --target "$deps_dir" \
                --require-hashes --only-binary=:all: --no-deps -r "$lock"
              PYTHONPATH="$deps_dir:/app/src" python3 -m unittest discover -s "${dir}/tests" -t "$dir" -v
            fi
            echo "::endgroup::"
          done

  dependencies-install:
    name: dependencies (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.locks != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Same Python and glibc as the server image, so pip picks what users get.
    container: python:3.12-slim-bookworm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install every lock file with pip, hash-checked, wheels only
        shell: bash
        env:
          LOCKS: ${{ needs.changes.outputs.locks }}
        run: |
          set -euo pipefail
          uname -m
          read -r -a locks <<< "$LOCKS"
          for lock in "${locks[@]}"; do
            echo "::group::${lock}"
            target="$(mktemp -d)"
            python3 -m pip install --disable-pip-version-check --no-cache-dir --root-user-action=ignore \
              --target "$target" --require-hashes --only-binary=:all: --no-deps \
              -r "$lock"
            rm -rf "$target"
            echo "::endgroup::"
          done
